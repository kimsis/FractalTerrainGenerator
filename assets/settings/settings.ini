; All of the app's startup defaults in one place. Every value here is either a one-time initial
; setting (window/camera/renderer) or a live-adjustable GUI slider's starting value (terrain/chunks)
; — the sliders themselves stay fully adjustable in the running app, this only affects what they
; start at. Edit and relaunch to change defaults without touching source code.

[window]
refresh_rate = 60
title = FractalTerrainGenerator

[camera]
fov = 60.0
near = 1.0
far = 10000.0
position_x = -30.0
position_y = 0.0
position_z = 30.0
yaw = 0.0
pitch = -45.0
speed = 5.0
mouse_sensitivity = 0.005
scroll_sensitivity = 0.5

[renderer]
wireframe = false
backface_culling = false
depthtest = true
normals = false
texcoords = false
background_r = 0.14
background_g = 0.4
background_b = 0.37

[light]
color_r = 0.85
color_g = 0.85
color_b = 0.85
dir_x = 0.0
dir_y = 1.0
dir_z = -1.0

[terrain]
hurst = 0.8
seed = 1337
grid_size_exponent = 4
height_scale = 1.0
roughness = 0.6
water_level = 2.0
blend_duration = 2.0
ka = 0.1
kd = 0.9
ks = 0.3
alpha = 10.0
dirt_to_grass_height_offset = 3.0
grass_to_rock_height_offset = 10.0
height_color_transition_band = 2.0
water_depth_bias = 0.05

[chunks]
view_radius = 16
max_destroys_per_frame = 16
max_uploads_per_frame = 8

[demo]
height_interp_duration = 1.0
water_interp_duration = 1.0
